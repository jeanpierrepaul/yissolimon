    <!-- Écran d'ouverture : styles intégrés pour qu'il s'affiche dès le premier instant, avant le reste de l'appli. -->
    <style>
      #ouverture { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; overflow: hidden;
        background: radial-gradient(circle at 50% 35%, #8A6EFF 0%, #6C4CF1 45%, #4F33D1 100%); color: #fff; text-align: center;
        font-family: 'Nunito Variable', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        transition: opacity .55s ease, transform .55s ease; }
      #ouverture.sortie { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #ouverture .bulle { position: absolute; bottom: -80px; border-radius: 50%; background: #fff; opacity: .12; animation: monter 7s linear infinite; }
      #ouverture .bulle.s { background: #FFC93C; opacity: .35; }
      #ouverture .b1 { left: 8%; width: 46px; height: 46px; animation-duration: 6s; }
      #ouverture .b2 { left: 22%; width: 18px; height: 18px; animation-delay: 1.2s; }
      #ouverture .b3 { left: 70%; width: 60px; height: 60px; animation-duration: 8s; animation-delay: .4s; }
      #ouverture .b4 { left: 86%; width: 22px; height: 22px; animation-delay: 2s; }
      #ouverture .b5 { left: 45%; width: 14px; height: 14px; animation-duration: 5s; animation-delay: .8s; }
      #ouverture .b6 { left: 58%; width: 30px; height: 30px; animation-duration: 6.5s; animation-delay: 2.6s; }
      #ouverture .halo { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -230px 0 0 -150px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 201, 60, .45) 0%, rgba(255, 201, 60, 0) 70%); animation: respirer 2s ease-in-out infinite alternate; }
      #ouverture .devi { position: relative; width: 150px; height: 150px; animation: arrivee .7s cubic-bezier(.3, 1.5, .5, 1) both, sauter .9s .7s cubic-bezier(.5, 0, .5, 1) infinite alternate; transform-origin: 50% 100%; }
      #ouverture .ombre { width: 96px; height: 12px; border-radius: 50%; background: rgba(36, 27, 79, .3); animation: ombrer .9s .7s cubic-bezier(.5, 0, .5, 1) infinite alternate; }
      #ouverture h1 { margin: 1.1rem 0 0; font-size: 2.6rem; font-weight: 900; letter-spacing: .01em; line-height: 1.1; }
      #ouverture h1 span { display: inline-block; opacity: 0; animation: lettre .5s cubic-bezier(.3, 1.4, .5, 1) forwards; }
      #ouverture .slogan { margin: .35rem 0 0; font-size: 1.1rem; font-weight: 700; color: #FFE08A; opacity: 0; animation: apparaitre .6s 1.05s forwards; }
      #ouverture .barre { width: 220px; height: 8px; margin-top: 1.6rem; border-radius: 99px; background: rgba(255, 255, 255, .22); overflow: hidden; }
      #ouverture .barre i { display: block; height: 100%; width: 100%; border-radius: inherit; background: #FFC93C; transform-origin: left; transform: scaleX(0); animation: remplir 4.6s .2s cubic-bezier(.4, 0, .2, 1) forwards; }
      #ouverture .messages { position: relative; height: 1.5rem; width: 320px; margin-top: .7rem; font-size: .95rem; font-weight: 600; color: rgba(255, 255, 255, .85); }
      #ouverture .messages span { position: absolute; inset: 0; opacity: 0; animation: message 1.25s forwards; }
      #ouverture .messages span:nth-child(1) { animation-delay: .3s; }
      #ouverture .messages span:nth-child(2) { animation-delay: 1.6s; }
      #ouverture .messages span:nth-child(3) { animation-delay: 2.9s; }
      #ouverture .messages span:nth-child(4) { animation-delay: 4.2s; animation-name: dernier; }
      /* Petits objets de la petite enfance tout autour de Dévi : cahier, livre, crayons, biberon, hochet, cubes… */
      #ouverture .objet { position: absolute; width: clamp(38px, 10vw, 66px); height: clamp(38px, 10vw, 66px);
        animation: surgir .55s cubic-bezier(.3, 1.6, .5, 1) var(--d, .3s) both; filter: drop-shadow(0 6px 10px rgba(36, 27, 79, .25)); }
      #ouverture .objet svg { width: 100%; height: 100%; display: block; animation: flotter var(--f, 2.4s) ease-in-out infinite alternate; transform: rotate(var(--r, 0deg)); }
      #ouverture .objet.p { width: clamp(28px, 7vw, 46px); height: clamp(28px, 7vw, 46px); }
      @keyframes surgir { from { opacity: 0; transform: scale(0) rotate(-30deg); } to { opacity: 1; transform: none; } }
      @keyframes flotter { from { transform: translateY(0) rotate(var(--r, 0deg)); } to { transform: translateY(-9px) rotate(calc(var(--r, 0deg) + 8deg)); } }
      @keyframes monter { to { transform: translateY(-115vh); } }
      @keyframes respirer { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.1); opacity: 1; } }
      @keyframes arrivee { from { transform: translateY(60px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sauter { from { transform: translateY(0) scale(1.04, .96); } to { transform: translateY(-26px) scale(.98, 1.03); } }
      @keyframes ombrer { from { transform: scale(1); } to { transform: scale(.65); opacity: .6; } }
      @keyframes lettre { from { opacity: 0; transform: translateY(18px) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes apparaitre { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes remplir { to { transform: scaleX(1); } }
      @keyframes message { 0% { opacity: 0; transform: translateY(8px); } 20%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
      @keyframes dernier { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #ouverture *, #ouverture h1 span { animation: none !important; opacity: 1 !important; transform: none !important; }
        #ouverture .bulle, #ouverture .messages span:not(:last-child) { display: none; }
        #ouverture .barre i { transform: scaleX(.8) !important; }
      }
    </style>
